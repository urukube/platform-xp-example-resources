apiVersion: compute.platform.urukube.io/v1alpha1
kind: UEks
metadata:
  name: urukube-eks-dev
  namespace: default
  # Dev claim: public endpoint, t3.medium nodes, 2 AZs.
  # vpcId, subnetIds, subnetCidrs, nodeSecurityGroupId and controlPlaneSecurityGroupId
  # come from the UNetwork claim — apply claim-network-dev.yaml first, then copy from:
  #   kubectl get unetwork urukube-network-dev -o yaml | grep -A20 status
spec:
  parameters:
    awsAccountId: "472506473117"
    region: us-east-1
    buId: BU001
    env: dev
    friendlyName: bu001-dev
    # --- values from UNetwork claim status (urukube-network-dev) ---
    vpcId: vpc-0c1686e5b11660275
    subnetIds:
      - subnet-04b57bec870b77e8e # us-east-1a EKS node subnet
      - subnet-02472b229ba6b46e8 # us-east-1b EKS node subnet
    subnetCidrs:
      - 10.10.0.0/19
      - 10.10.32.0/19
    nodeSecurityGroupId: sg-04e578405cab3e1d6
    controlPlaneSecurityGroupId: sg-0d4cced995f00526a
    # ---------------------------------------------------------------
    kubernetesVersion: "1.36"
    nodeAmiId: ami-082b37985d4f2aa44 # AL2023 EKS 1.36 x86_64 us-east-1 (2026-06-30)
    nodeInstanceType: t3.small # t3.medium isn't Free Tier eligible in this account
    endpointAccessType: public
    adminRoleArns:
      - arn:aws:iam::472506473117:role/CrossplaneEKSAdmin
    tags:
      team: platform
      managed-by: crossplane
