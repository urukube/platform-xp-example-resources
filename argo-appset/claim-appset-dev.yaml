apiVersion: gitops.platform.urukube.io/v1alpha1
kind: UArgoAppSet
metadata:
  name: bu001-main-gitops
  namespace: default
  # Deploys any repo in githubOrg carrying the repoLabel topic, on any branch
  # matching branchPattern, to the cluster named <eksFriendlyName>-eks — apply
  # claim-eks-dev.yaml (in ../eks/) first and confirm it's Ready before this.
spec:
  parameters:
    buId: BU001
    eksFriendlyName: bu001-dev
    environment: dev
    awsAccountId: "472506473117"
    githubOrg: urukubetestorg
    repoLabel: main-preview
    branchPattern: "^main$"
    # githubOrgPat is a raw secret value — DO NOT commit a real PAT here.
    # Apply this claim with the token injected at apply time instead, e.g.:
    #   kubectl apply -f - <<EOF
    #   $(yq eval '.spec.parameters.githubOrgPat = strenv(GITHUB_ORG_PAT)' claim-appset-dev.yaml)
    #   EOF
    githubOrgPat: "<inject-at-apply-time, never commit>"
